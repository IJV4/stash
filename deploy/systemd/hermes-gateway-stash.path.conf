# stash's GPU probe runs nvidia-smi, which on WSL2 is in /usr/lib/wsl/lib.
# The Windows PATH entries are hidden by the hardening drop-in, so leave them out.
[Service]
Environment="PATH=/usr/lib/wsl/lib:%h/.hermes/hermes-agent/node_modules/.bin:%h/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
