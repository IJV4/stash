# Confine the stash gateway. Anything not listed is invisible or read-only to it.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
# The whole home folder is hidden (~/.ssh, ~/.claude, other projects, shell history)...
ProtectHome=tmpfs
# ...and so are the Windows drives.
InaccessiblePaths=-/mnt/c -/mnt/d -/mnt/e -/mnt/f
# Read-only: the stash source, the stash config, deno.
BindReadOnlyPaths=/home/ismael/projects/stash /home/ismael/.config/stash /home/ismael/.deno
# Read-write: Hermes' home (its launcher keeps lock and state files in the root) and the stash database.
BindPaths=/home/ismael/.hermes /home/ismael/.local/share/stash
# ...except the default profile's secrets and history, which stash never needs.
InaccessiblePaths=-/home/ismael/.hermes/.env -/home/ismael/.hermes/backups -/home/ismael/.hermes/sessions -/home/ismael/.hermes/memories -/home/ismael/.hermes/auth.json
