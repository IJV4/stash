[project]
name = "stash"
version = "0.1.0"
description = "Personal organizer for things I want to do: capture, AI filing, nudges."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "yt-dlp[default]>=2026.10.26",
]

[project.optional-dependencies]
# Only needed for the eval's OCR arm and only if it beats the vision model (docs/adr/0003).
ocr = ["pytesseract>=0.3.13", "pillow>=11"]

[project.scripts]
stash = "stash.cli:main"

[dependency-groups]
dev = [
    "stash[ocr]",
    "pytest>=9.2,<10",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "python-telegram-bot==22.8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-m", "not integration", "--import-mode=importlib"]
markers = ["integration: exercises a real adapter (SQLite file, ...); excluded from the default run"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytesseract", "pytesseract.*"]
ignore_missing_imports = true
